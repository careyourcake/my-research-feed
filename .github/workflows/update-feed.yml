name: Update research RSS feed

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC is 08:00 Asia/Shanghai.
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate RSS XML
        run: python generate_feed.py

      - name: Validate RSS XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('my_research_feed.xml')"

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_research_feed.xml
          if git diff --cached --quiet; then
            echo "Feed is unchanged."
          else
            git commit -m "chore: update research RSS feed"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
